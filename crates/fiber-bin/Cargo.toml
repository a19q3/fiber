[package]
name = "fiber-bin"
version = "0.8.0"
edition = "2021"

[[bin]]
name = "fnn"
path = "src/main.rs"

[[bin]]
name = "x402-facilitator"
path = "src/x402_facilitator.rs"

[features]
default = ["fnn/rocksdb"]
metrics = ["fnn/metrics"]
sqlite = ["fnn/sqlite"]

[dependencies]
fnn = { path = "../fiber-lib" }
ckb-chain-spec = "1"
ckb-resource = "1"
ractor = { version = "0.15", features = [
  "async-trait",
] }
jsonrpsee = { version = "0.25", features = ["http-client"] }
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "rt",
    "rt-multi-thread",
    "sync",
    "net",
    "time",
    "signal",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hyper = { version = "1.5", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
